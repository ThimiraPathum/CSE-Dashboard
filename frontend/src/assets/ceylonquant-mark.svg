<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 72" fill="none">
  <!-- Bar 1 (Shortest) -->
  <rect x="10" y="44" width="7" height="18" rx="1.5" fill="#173f70"/>
  <!-- Bar 2 -->
  <rect x="20" y="34" width="7.5" height="28" rx="1.5" fill="#13365e"/>
  <!-- Bar 3 -->
  <rect x="30.5" y="24" width="8" height="38" rx="1.5" fill="#102d50"/>
  <!-- Bar 4 -->
  <rect x="41.5" y="14" width="8.5" height="48" rx="1.5" fill="#0d2440"/>
  <!-- Bar 5 (Tallest) -->
  <rect x="53" y="6" width="9" height="56" rx="1.5" fill="#091b30"/>

  <!-- CSE Base Badge -->
  <rect x="28" y="49" width="35" height="15" rx="2" fill="#08182b" stroke="#1d4373" stroke-width="0.8"/>
  <text x="45.5" y="60.5" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="9" fill="#ffffff" text-anchor="middle" letter-spacing="1">CSE</text>

  <!-- Golden Rising Arrow Gradient & Shadow -->
  <defs>
    <linearGradient id="cqArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="45%" stop-color="#e5a93c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="cqArrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Curved Dynamic Golden Ribbon Arrow -->
  <!-- Swooping Path -->
  <path d="M 6 56 C 16 52 24 45 35 32 C 43 22 51 13 58 7" stroke="url(#cqArrowGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#cqArrowShadow)"/>
  
  <!-- Arrowhead pointing top-right -->
  <polygon points="53,4 67,5 61,19 57,13" fill="url(#cqArrowGrad)" filter="url(#cqArrowShadow)"/>
</svg>
